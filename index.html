<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Check</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen" id="start-screen">
            <h1>Quiz Time!</h1>
            <p>Test your knowledge with an interactive quiz.</p>
            <button id="start-button">Start Quiz</button>
        </div>

        <div class="quiz-screen" id="quiz-screen">
           <div class="quiz-header"> 
            <h2 id="question-text">Question text</h2>
            <div class="quiz-info"> 
            <p>Question <span id="question-number">1</span> of <span id="total-questions">5</span></p>
            <p>Score: <span id="score">0</span></p>
           </div> 
        </div>

        <div class="answers-container" id="answers-container"> </div>
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>
        <div id="result-screen" class="quiz-screen">
            <h1>Quiz Results</h1>
            <p>Your final score is: <span id="final-score">0</span>/<span id="total-questions-result">5</span></p>
            <div id="result-message"> Good job!</div>
            <button id="restart-button">Restart Quiz</button>
        </div>
    </div>
    
</body>
</html>
